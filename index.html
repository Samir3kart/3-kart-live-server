<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3 Kart LIVE</title>
<style>
:root{--bg:#0b1020;--panel:#151c32;--panel2:#1c2642;--text:#fff;--muted:#9aa6c2;--accent:#ff3b6b;--gold:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at top,#202a4a 0,#0b1020 55%);color:var(--text);font-family:Inter,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1200px;margin:auto;padding:18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
h1{font-size:28px;margin:0} .sub{color:var(--muted);font-size:14px;margin-top:4px}
.badge{padding:9px 12px;border-radius:999px;background:#28334f;color:#dce4f7;font-size:13px}
.badge.ok{background:#153e2b;color:#7dffb2}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--accent);color:#fff}
button.secondary{background:#2a3552} button.gold{background:#b98600;color:#111}
.info{background:var(--panel);border:1px solid #2a3552;border-radius:16px;padding:12px 14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--panel);border:1px solid #2a3552;border-radius:16px;padding:12px;min-height:210px}
.card.empty{opacity:.45}
.name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.handle{color:var(--muted);font-size:12px;margin-top:2px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.playcard{height:112px;border-radius:12px;background:linear-gradient(145deg,#313d64,#151c32);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;border:1px solid #46547c}
.playcard.hidden{font-size:0}.playcard.hidden:after{content:"?";font-size:34px;color:#9eacd0}
.score{text-align:center;color:var(--gold);font-size:18px;font-weight:900;margin-top:9px}
.gift{margin-top:8px;color:#ff9ab3;font-size:12px;font-weight:800}
.winner{outline:3px solid var(--gold)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}} 
@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:23px}.playcard{height:95px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>🎴 3 KART LIVE</h1><div class="sub">Parfum göndərən iştirakçı avtomatik oyuna daxil olur</div></div>
    <div id="connection" class="badge">● Bağlantı yoxlanır...</div>
  </div>

  <div class="info">
    <b id="status">Gözləyir</b>
    <span> · Raund <b id="round">1</b> · <b id="count">0</b>/12 iştirakçı</span>
  </div>

  <div class="controls">
    <button id="start">Raundu başlat</button>
    <button id="reset" class="secondary">Yeni raund</button>
    <button id="demo" class="gold">Test: Parfum</button>
  </div>

  <div id="grid" class="grid"></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const $=id=>document.getElementById(id);

function render(s){
  $("status").textContent=s.status;
  $("round").textContent=s.round;
  $("count").textContent=s.players.length;
  $("connection").textContent=s.connected?"● TikTok LIVE qoşulub":"● TikTok gözləyir";
  $("connection").className="badge"+(s.connected?" ok":"");

  const html=[];
  for(let i=0;i<12;i++){
    const p=s.players[i];
    if(!p){
      html.push('<div class="card empty"><div class="name">Boş yer</div><div class="cards"><div class="playcard hidden"></div><div class="playcard hidden"></div><div class="playcard hidden"></div></div></div>');
      continue;
    }
    const winner=s.revealed && p.score===Math.max(...s.players.map(x=>x.score??-1));
    html.push(`<div class="card ${winner?'winner':''}">
      <div class="name">${esc(p.nickname)}</div>
      <div class="handle">@${esc(p.username)}</div>
      <div class="cards">${p.cards.map(v=>`<div class="playcard ${s.revealed?'':'hidden'}">${s.revealed?v:''}</div>`).join('')}</div>
      ${s.revealed?`<div class="score">${p.score} xal</div>`:''}
      <div class="gift">🎁 PARFUM</div>
    </div>`);
  }
  $("grid").innerHTML=html.join("");
}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
socket.on("state",render);
$("start").onclick=()=>socket.emit("start-round");
$("reset").onclick=()=>socket.emit("reset");
$("demo").onclick=()=>socket.emit("demo-gift",{username:"test"+Date.now().toString().slice(-4),nickname:"Test iştirakçı"});
</script>
</body>
</html>
